services:
  mysql:
    image: mysql:8.0
    container_name: silvaldeweb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - silvaldeweb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: silvaldeweb-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      JWT_ISSUER: ${JWT_ISSUER}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_ADMIN_ROLES: ${APP_ADMIN_ROLES}
      APP_CUSTOMER_USERNAME: ${APP_CUSTOMER_USERNAME}
      APP_CUSTOMER_PASSWORD: ${APP_CUSTOMER_PASSWORD}
      APP_CUSTOMER_ROLES: ${APP_CUSTOMER_ROLES}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - silvaldeweb-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: silvaldeweb-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - silvaldeweb-network

volumes:
  mysql_data:

networks:
  silvaldeweb-network:
    driver: bridge
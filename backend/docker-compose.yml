version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: silvaldeweb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: silvalde_web_db
      MYSQL_USER: silvalde_web_user
      MYSQL_PASSWORD: silvalde_web_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - silvaldeweb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: .
    container_name: silvaldeweb-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/silvalde_web_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: silvalde_web_user
      SPRING_DATASOURCE_PASSWORD: silvalde_web_pass
      APP_CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - silvaldeweb-network

volumes:
  mysql_data:

networks:
  silvaldeweb-network:
    driver: bridge
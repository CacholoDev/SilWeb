services:
  mysql:
    image: mysql:8.0
    container_name: silvaldeweb-mysql
    env_file:
      - ../.env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - silvaldeweb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: .
    container_name: silvaldeweb-backend
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - silvaldeweb-network

volumes:
  mysql_data:

networks:
  silvaldeweb-network:
    driver: bridge
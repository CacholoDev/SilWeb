spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/silvalde_web_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me_local_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

app.security.jwt.secret=${JWT_SECRET:change_me_dev_jwt_secret_for_silvalde_web}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.security.jwt.issuer=${JWT_ISSUER:silvalde-web}

app.security.users.admin.username=${APP_ADMIN_USERNAME:admin}
app.security.users.admin.password=${APP_ADMIN_PASSWORD:change_me_admin_password}
app.security.users.admin.roles=${APP_ADMIN_ROLES:ADMIN}

app.security.users.customer.username=${APP_CUSTOMER_USERNAME:customer}
app.security.users.customer.password=${APP_CUSTOMER_PASSWORD:change_me_customer_password}
app.security.users.customer.roles=${APP_CUSTOMER_ROLES:CUSTOMER}

spring.web.error.include-binding-errors=always
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.whitelabel.enabled=false
